name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 21 ───────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle ────────────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ── 4. Decode keystore з Base64 секрету ──────────────────────────────────
      - name: Decode release keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/release.keystore"

      # ── 5. Збирання та підпис release APK ───────────────────────────────────
      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # ── 6. Перейменування APK ────────────────────────────────────────────────
      - name: Rename APK asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/Pillshelf-${{ github.ref_name }}.apk

      # ── 7. Upload artifact (доступний у Summary) ─────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pillshelf-${{ github.ref_name }}-apk
          path: release/Pillshelf-${{ github.ref_name }}.apk
          retention-days: 30

      # ── 8. Публікація GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Pillshelf ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Pillshelf ${{ github.ref_name }} 💊📦

            ### Що нового / What's New:
            - **🇺🇦 Домашня аптечка**: Повний облік ліків, категорій, форми випуску та кольорових маркерів.
            - **Контроль залишків**: Автоматичні попередження про низький запас (≤ 5 од.) та швидке поповнення.
            - **Терміни придатності**: Моніторинг прострочених препаратів та тих, що закінчуються найближчим часом.
            - **⏰ Розклад прийому**: Гнучкі графіки (ранок/день/вечір, циклічні інтервали, курси), облік їжі, швидкі дії «Прийняти» / «Пропустити» та прогрес дня.
            - **💰 Моніторинг цін**: Відстеження динаміки цін в українських аптеках (АНЦ, Бажаємо Здоров'я, Подорож, 9-1-1) та інтеграція з Tabletki.ua.
            - **⚠️ Аналізатор взаємодії ліків**: Автоматичне попередження про дублювання парацетамолу та комбінації НПЗП.
            - **📜 Журнал прийому**: Історія прийомів, статистика комплаєнсу та скасування дій.
            - **🔔 Фонові сповіщення**: Інтеграція з WorkManager для надійних нагадувань.

            ### Встановлення / Installation:
            Завантажте файл `Pillshelf-${{ github.ref_name }}.apk` нижче та встановіть його на ваш Android-пристрій (Android 8.0+).
          files: release/Pillshelf-${{ github.ref_name }}.apk
          draft: false
          prerelease: false
