name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Prepare Release APK Asset
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Pillshelf-v1.0.0.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## Pillshelf v1.0.0 💊📦

            ### Що нового / What's New:
            - **🇺🇦 Домашня аптечка**: Повний облік ліків, категорій, форми випуску та кольорових маркерів.
            - **Контроль залишків**: Автоматичні попередження про низький запас ($\le 5$ од.) та швидке поповнення.
            - **Терміни придатності**: Моніторинг прострочених препаратів та тих, що закінчуються найближчим часом.
            - **⏰ Розклад прийому**: Гнучкі графіки (ранок/день/вечір, циклічні інтервали, курси), облік їжі, швидкі дії «Прийняти» / «Пропустити» та прогрес дня.
            - **💰 Моніторинг цін**: Відстеження динаміки цін в українських аптеках (АНЦ, Бажаємо Здоров'я, Подорож, 9-1-1) та інтеграція з Tabletki.ua.
            - **⚠️ Аналізатор взаємодії ліків**: Автоматичне попередження про дублювання парацетамолу та комбінації НПЗП.
            - **📜 Журнал прийому**: Історія прийомів, статистика комплаєнсу та скасування дій.
            - **🔔 Фонові сповіщення**: Інтеграція з WorkManager для надійних нагадувань.

            ### Встановлення / Installation:
            Завантажте файл `Pillshelf-v1.0.0.apk` нижче та встановіть його на ваш Android-пристрій (Android 8.0+).
          files: |
            release/Pillshelf-v1.0.0.apk
          draft: false
          prerelease: false
