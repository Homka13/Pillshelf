name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      # ── 0. Перевірка наявності всіх секретів ─────────────────────────────────
      # Fails FAST before wasting build minutes if any secret is missing.
      # Це запобігає випадковому релізу з невірним або відсутнім підписом.
      - name: Validate signing secrets
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD \
                      RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [[ -z "${!name}" ]] && missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "❌ Missing required GitHub Secrets: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ All signing secrets are present"

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 21 ───────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle ────────────────────────────────────────────────────────────
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ── 4. Права виконання gradlew (Linux CI не зберігає chmod з git) ────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ── 5. Decode keystore з Base64 секрету ──────────────────────────────────
      - name: Decode release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          # Перевіряємо що keystore валідний і пароль підходить
          if keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
               -storepass "$RELEASE_STORE_PASSWORD" -noprompt > /dev/null 2>&1; then
            echo "✅ Keystore is valid"
          else
            echo "❌ Keystore is invalid or RELEASE_STORE_PASSWORD is wrong"
            exit 1
          fi

      # ── 6. Збирання підписаного release APK ──────────────────────────────────
      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # ── 7. Знаходимо APK динамічно (AGP може генерувати різні назви) ─────────
      - name: Locate and rename APK
        run: |
          # AGP може видати app-release.apk або app-release-unsigned.apk
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [[ -z "$APK_PATH" ]]; then
            echo "❌ No APK found in app/build/outputs/apk/release/"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          mkdir -p release
          cp "$APK_PATH" "release/Pillshelf-${{ github.ref_name }}.apk"
          echo "APK_FINAL=release/Pillshelf-${{ github.ref_name }}.apk" >> $GITHUB_ENV

      # ── 8. Верифікація підпису APK ───────────────────────────────────────────
      # Підтверджує що APK підписаний потрібним ключем, а не debug/unsigned.
      # Якщо підпис відсутній або невірний — реліз не відбудеться.
      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -1)/apksigner"
          echo "Using apksigner: $APKSIGNER"

          # Підпис має бути валідним, інакше реліз не відбудеться.
          if ! "$APKSIGNER" verify --verbose "$APK_FINAL"; then
            echo "❌ APK signature verification FAILED"
            exit 1
          fi
          echo "✅ APK signature is valid"

          echo ""
          echo "=== APK Signer Certificate ==="
          "$APKSIGNER" verify --print-certs "$APK_FINAL"

          # Fingerprint сертифіката + контрольна сума APK — у release notes,
          # щоб користувач міг перевірити, що файл справді наш.
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK_FINAL" \
            | grep -m1 -i "SHA-256 digest" | awk '{print $NF}')
          APK_SHA256=$(sha256sum "$APK_FINAL" | awk '{print $1}')
          echo "CERT_SHA256=$CERT_SHA256" >> $GITHUB_ENV
          echo "APK_SHA256=$APK_SHA256"   >> $GITHUB_ENV

          echo ""
          echo "Signing cert SHA-256: $CERT_SHA256"
          echo "APK file SHA-256:     $APK_SHA256"

      # ── 9. Upload artifact (доступний у Summary) ─────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pillshelf-${{ github.ref_name }}-apk
          path: ${{ env.APK_FINAL }}
          retention-days: 30

      # ── 10. Публікація GitHub Release ────────────────────────────────────────
      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Pillshelf ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            <p align="center">
              <b>Розумна домашня аптечка, трекер прийому ліків і моніторинг цін в аптеках України</b><br>
              <i>Smart medicine cabinet, pill adherence tracker & Ukrainian pharmacy price monitor</i>
            </p>

            Повністю **offline-first** застосунок: список ліків, історія прийомів
            і всі персональні дані лишаються **лише на вашому пристрої**, у локальній
            базі Room. Жодної реєстрації, жодної синхронізації з чужими серверами.

            ---

            ## ✨ Що вміє Pillshelf

            **💊 Домашня аптечка**
            Каталог препаратів із формою випуску, діючою речовиною, дозуванням і
            категорією. Живий пошук за назвою або діючою речовиною, фільтри за
            категоріями та кольорові мітки для швидкої навігації.

            **📉 Контроль залишків і термінів придатності**
            Попередження про низький запас (≤ 5 од.) і про нуль. Поповнення
            пресетами (+10 / +20 / +30 / +60) або довільним значенням. Прострочені
            ліки підсвічуються червоним, а ті, що спливають протягом 30 днів, —
            окремим попередженням.

            **⏰ Розклад прийому**
            Чотири режими: щоденний за часом дня (ранок / день / вечір), кожні
            N годин, фіксований курс (напр. антибіотики на 7–10 днів) і «за потреби».
            Враховується контекст їжі — до / під час / після. Дії «Прийняти» та
            «Пропустити» в один дотик, із прогрес-баром виконання плану на день.

            **⚠️ Аналізатор лікарських взаємодій**
            Попереджає про подвійний парацетамол (комбіновані чаї від застуди разом
            із парацетамолом у таблетках) — щоб уникнути гепатотоксичної дози, — а
            також про одночасний прийом кількох НПЗП (ібупрофен, аспірин, диклофенак).

            **💰 Моніторинг цін в аптеках України**
            Порівняння цін у мережах АНЦ, «Бажаємо Здоров'я», «Подорож» і «9-1-1».
            Аналіз динаміки за 30 днів, цільова ціна зі сповіщенням про вигідну
            покупку та перехід на Tabletki.ua в один клік.

            **📜 Журнал і аналітика**
            Хронологія прийомів із часовими мітками, відсоток дотримання схеми
            (adherence rate) і скасування помилкового запису з поверненням дози.

            **🔔 Фонові нагадування**
            Надійні сповіщення через WorkManager — працюють і після перезавантаження.

            ---

            ## 📥 Встановлення

            1. Завантажте `Pillshelf-${{ github.ref_name }}.apk` із розділу **Assets** нижче.
            2. Дозвольте встановлення з невідомих джерел для свого браузера чи файлового менеджера.
            3. Відкрийте файл і встановіть.

            **Вимоги:** Android 8.0 (API 26) або новіший.

            ## 🔐 Перевірка автентичності

            APK зібрано й підписано автоматично в GitHub Actions із цього тегу —
            ключ ніколи не залишає сховище секретів. Перевірити файл можна так:

            ```
            shasum -a 256 Pillshelf-${{ github.ref_name }}.apk
            ```

            | | |
            |---|---|
            | **SHA-256 файлу** | `${{ env.APK_SHA256 }}` |
            | **SHA-256 сертифіката підпису** | `${{ env.CERT_SHA256 }}` |

            Fingerprint сертифіката однаковий для всіх майбутніх релізів. Якщо він
            колись зміниться — оновлення не встановиться поверх старої версії, і це
            свідчить, що збірка зроблена іншим ключем.

            ---

            > **Застереження.** Pillshelf — застосунок для обліку, а не медичний
            > порадник. Попередження про взаємодії мають довідковий характер і не
            > замінюють консультацію лікаря або фармацевта.

            📄 Apache License 2.0

          files: ${{ env.APK_FINAL }}
          draft: false
          prerelease: false
