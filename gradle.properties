android.useAndroidX=true
kotlin.code.style=official
# -Djava.awt.headless=true: KSP тягне за собою embedded IntelliJ core, який
# піднімає AWT event queue. На тірдауні він кидає NullPointerException у
# AWT-EventQueue-0 (ApplicationManager.getApplication() == null) — збірку це
# не ламає, але GitHub Actions показує це як ##[error] в анотаціях.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.awt.headless=true
