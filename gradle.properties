android.useAndroidX=true
kotlin.code.style=official
# -Djava.awt.headless=true: тримає CI-збірку без AWT. Саме по собі це НЕ
# усувало NPE в AWT-EventQueue-0 з embedded IntelliJ core всередині KSP
# (баг проявлявся через раз) — його прибрало оновлення Kotlin 2.2.10 →
# 2.3.20 разом з KSP 2.3.5 → 2.3.12. Прапорець лишаємо як гігієну для CI.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.awt.headless=true
